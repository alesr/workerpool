name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Ultimate CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ultimate CI
        id: ultimate-ci
        uses: alesr/ultimate-ci@v1
        with:
          run-modernize: 'true'
          run-lint: 'true'
          run-vulncheck: 'true'
          run-tests: 'true'
          verify-tidy: 'true'
          race-detector: 'true'
          test-verbose: 'true'
          test-timeout: '10m'
          min-coverage: '0'
          lint-timeout: '5m'
          vulncheck-timeout: '3m'

      - name: Upload coverage reports to Codecov
        if: always() && steps.ultimate-ci.outputs.test-coverage-file != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: alesr/workerpool
          files: ${{ steps.ultimate-ci.outputs.test-coverage-file }}
