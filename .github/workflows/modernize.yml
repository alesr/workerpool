name: modernize
on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * 5"
permissions:
  contents: write
  pull-requests: write
jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: alesr/gomodern@v1
        with:
          mode: fix
          create-pr: "true"
